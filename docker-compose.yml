services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-local-only-change-me}
      DATABASE_URL: ${DATABASE_URL:-mysql://symfony_user:symfony_pass@db:3306/symfony_db?serverVersion=mariadb-10.5.0}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAILER_URL: ${MAILER_URL:-null://localhost}
      AWS_KEY: ${AWS_KEY:-}
      AWS_SECRET: ${AWS_SECRET:-}
      WKHTMLTOPDF_PATH: ${WKHTMLTOPDF_PATH:-/usr/local/bin/wkhtmltopdf}
      WKHTMLTOIMAGE_PATH: ${WKHTMLTOIMAGE_PATH:-/usr/local/bin/wkhtmltoimage}
      DB_BACKUP_PATH: ${DB_BACKUP_PATH:-/dbbackup/backup.sql}
      DB_BACKUP_IMPORT_ALLOW_NONEMPTY: ${DB_BACKUP_IMPORT_ALLOW_NONEMPTY:-0}
    volumes:
      - uploads-data:/var/www/html/public/uploads
      - documents-data:/var/www/html/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - uploads-data:/var/www/html/public/uploads:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony_db}
      MYSQL_USER: ${MYSQL_USER:-symfony_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-symfony_pass}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  uploads-data:
  documents-data:
