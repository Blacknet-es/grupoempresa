security:
    encoders:
        FOS\UserBundle\Model\UserInterface: bcrypt
    providers:
        in_memory:
            memory: ~
        fos_userbundle:
                id: fos_user.user_provider.username

    firewalls:
        # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern:            /(.*)
            context:            user
            form_login:
                provider:       fos_userbundle
                login_path:     /admin/login
                check_path:     /admin/login_check
                default_target_path: /admin/
                csrf_token_generator: security.csrf.token_manager
            logout:
                path:           /admin/logout
            anonymous:          true

        main:
            pattern: ^/
            form_login:
                provider: fos_userbundle
                csrf_token_generator: security.csrf.token_manager
            logout:       true
            anonymous:    true
    role_hierarchy:
            ROLE_ADMIN:          [ROLE_USER, ROLE_SUPER_ADMIN]

    access_control:
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }

        # User Autenticated only access area
        - { path: ^/dashboard, role: ROLE_ADMIN }
        - { path: ^/socio, role: ROLE_ADMIN }
        - { path: ^/file, role: ROLE_ADMIN }
        - { path: ^/metodo, role: ROLE_ADMIN }
        - { path: ^/download, role: ROLE_ADMIN }

        # Admin login page needs to be access without credential
        - { path: ^/admin/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/logout$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/login_check$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin, role: ROLE_ADMIN }
